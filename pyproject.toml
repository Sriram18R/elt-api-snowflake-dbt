[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-api-snowflake-dbt"
version = "1.0.0"
description = "Production-quality ELT pipeline: REST API → Snowflake → DBT with data quality and testing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Data Engineering Team", email = "data@example.com"}
]
keywords = [
    "elt",
    "etl",
    "snowflake",
    "dbt",
    "data-engineering",
    "data-quality"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "duckdb>=0.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "snowflake-sqlalchemy>=1.5.0",
    "dbt-core>=1.7.0",
    "dbt-snowflake>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.19",
]

all = ["elt-api-snowflake-dbt[dev]"]

[project.urls]
Homepage = "https://github.com/Sriram18R/elt-api-snowflake-dbt"
Documentation = "https://github.com/Sriram18R/elt-api-snowflake-dbt/tree/main/docs"
Repository = "https://github.com/Sriram18R/elt-api-snowflake-dbt.git"
Issues = "https://github.com/Sriram18R/elt-api-snowflake-dbt/issues"

[tool.setuptools]
packages = ["ingestion"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "snowflake: Snowflake-specific tests",
]

[tool.coverage.run]
source = ["ingestion"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dbt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "snowflake.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
    "dbt_project",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "W505",   # doc-line-too-long
    "B008",   # function-call-in-default-argument
    "ARG001", # unused-function-argument
]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]
known-third-party = ["dbt", "snowflake"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | dbt_project
)/
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = 311
known_first_party = ["ingestion"]
skip_gitignore = true
skip = [".venv", "venv", "dbt_project"]
