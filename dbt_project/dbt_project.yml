dbt_project:
  name: 'elt_project'
  version: '1.0.0'
  config-version: 2
  profile: 'elt_project'

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
data-paths: ['data']
macro-paths: ['macros']
snapshot-paths: ['snapshots']
target-path: 'target'
clear-targets: true

models:
  elt_project:
    materialized: table
    staging:
      materialized: view
    marts:
      materialized: table

seeds:
  elt_project:
    +column_types:
      id: integer
